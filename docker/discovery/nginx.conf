server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /.well-known/eo-services.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}

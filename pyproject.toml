[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eosdk"
version = "0.5.0"
description = "Python SDK and CLI for Earth Observation services: catalogue search, EOData download, auth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Paweł Przestrzelski", email = "pprzestrzelski@cloudferro.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "tenacity>=8.3",
    "tomli>=2; python_version < '3.11'",
    "tomlkit>=0.12",
]

[project.urls]
Repository = "https://gitlab.cloudferro.com/data-access/eosdk"
Issues = "https://gitlab.cloudferro.com/data-access/eosdk/-/issues"
Changelog = "https://gitlab.cloudferro.com/data-access/eosdk/-/blob/master/CHANGELOG.md"

[project.scripts]
eo = "eosdk.cli.main:app"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    # `server` powers the out-of-process CLI journeys: respx patches httpx
    # inside this process, so a subprocess needs a real S3 on a real socket.
    "moto[s3,server]>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "freezegun>=1.5",
    # validates `--json` / `--format json` output against the committed
    # schemas in schemas/cli/ (SPEC §12)
    "jsonschema>=4.20",
    # Installed unconditionally so mypy (pinned to python_version 3.10) can
    # resolve the `import tomli` fallback branch in config/loader.py.
    "tomli>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eosdk"]

# The sdist is a buildable source tree, not a repo mirror. SPEC.md and the test
# plan are design documents for contributors (they live in the repo, and the
# README links to them there); `data/` holds EOData that smoke tests download
[tool.hatch.build.targets.sdist]
exclude = [
    "SPEC.md",
    "RELEASING.md",
    "smoke-summary.json",
    ".claude",
    "data",
    "site",
    "benchmarks",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TC", "RUF", "C4", "PT", "PTH", "RET", "PERF"]
# PERF203: try/except inside loops here are deliberate retry / collect-errors patterns
ignore = ["PERF203"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TC"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/eosdk"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests over respx fixtures",
    "e2e: multi-step journeys over the FakePlatform harness",
    "smoke: live tests against a real platform (EOSDK_SMOKE=1)",
    "smoke_auth: live tests needing credentials",
    "slow: transfers real data; opt in explicitly",
]

[tool.coverage.run]
source = ["eosdk"]

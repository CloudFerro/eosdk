[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eosdk"
version = "0.1.0.dev0"
description = "Python SDK and CLI for Earth Observation services: catalogue search, EOData download, auth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CloudFerro" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "tenacity>=8.3",
    "tomli>=2; python_version < '3.11'",
    "tomlkit>=0.12",
]

[project.scripts]
eo = "eosdk.cli.main:app"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "moto[s3]>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "freezegun>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eosdk"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TC", "RUF"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TC"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/eosdk"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests over respx fixtures",
    "smoke: live tests against a real platform (EOSDK_SMOKE=1)",
    "slow: transfers real data; opt in explicitly",
]

[tool.coverage.run]
source = ["eosdk"]
